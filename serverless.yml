provider:
  assets:
    root: dist
    defer: true
    ares:
      autoDeploy: true
      intranet: true

functions:
  app:
    path: '*'
    handler: 'functions/app'

package:
  rootDir: .
  build: npm run build
  include:
    - dist
    - functions
    - libs/runtime-config.cjs
  exclude:
    - src
    - public
